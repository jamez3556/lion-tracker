<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex">
<title>LION DO Snap</title>
<style>
  :root{--brand:#e8730f;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:#0f172a;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  header h1{font-size:16px;font-weight:800}
  header .who{margin-left:auto;font-size:11.5px;color:#94a3b8;text-align:right}
  header .who a{color:#fbbf24;text-decoration:none;font-weight:600}
  main{max-width:560px;margin:0 auto;padding:14px 12px 100px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .bigrow{display:flex;gap:10px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .stat .n{font-size:19px;font-weight:800}
  .stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  .stat.warn .n{color:#dc2626}
  .stat.ok .n{color:#16a34a}
  button.primary{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
  button.primary:disabled{opacity:.55}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
  .chips button{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer}
  .snapbtn{border:2px dashed var(--brand);background:#fff7ed;border-radius:14px;padding:18px;width:100%;font-size:16px;font-weight:800;color:var(--brand);cursor:pointer;text-align:center}
  .snapbtn.got{border-style:solid;background:#f0fdf4;border-color:#16a34a;color:#166534}
  .thumb{width:54px;height:54px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
  .item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:6px;font-size:13.5px}
  .item .mid{flex:1;min-width:0}
  .item .awb{font-weight:800}
  .item .sub{color:var(--muted);font-size:11.5px;margin-top:1px}
  .st{font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .st.p{color:#b45309;border:1px solid #f59e0b}
  .st.b{color:#16a34a;border:1px solid #16a34a}
  .st.t{color:#0369a1;border:1px solid #0369a1}
  .del{background:none;border:none;font-size:15px;cursor:pointer;opacity:.6}
  .exrow{display:flex;gap:8px;align-items:center;font-size:13.5px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-bottom:6px}
  .exrow b{flex:1}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;transition:.25s;z-index:30;max-width:92vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #gate{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
  #gate .box{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:360px}
  #gate h1{font-size:19px;margin-bottom:4px}
  #gate p{font-size:13px;color:var(--muted);margin-bottom:16px}
  #gate .err{color:#dc2626;font-size:12.5px;min-height:16px;margin-top:8px}
  .muted{color:var(--muted);font-size:12.5px}
</style>

    <h1>📸 LION DO Snap</h1>

    <form onsubmit="return doSignIn(event)">
      <div class="field"><label>EMAIL</label><input id="g_email" type="email" required autocomplete="username"></div>

</div>

<header>

<main>

      </div>
      <div class="grid2">
        <div class="field"><label>CUSTOMER (optional)</label><input id="f_customer" placeholder="name on the DO"></div>
        <div class="field"><label>MACL BILL Rf (optional)</label><input id="f_macl" type="number" step="any" min="0" inputmode="decimal" placeholder="handling invoice total"></div>
      </div>
      <div class="field"><label>DEMURRAGE Rf (optional — the separate MACL demurrage invoice)</label><input id="f_demur" type="number" step="any" min="0" inputmode="decimal" placeholder="demurrage invoice total"></div>

          <button type="button" onclick="exAdd('Stamp')">＋ Stamp</button>

        <div id="exList"></div>
      </div>
      <div class="field">
        <label>MORE DOCUMENTS — MACL bills, AWB, receipts… (photos or PDFs)</label>
        <input type="file" id="f_more" accept="image/*,.pdf,application/pdf" multiple>
      </div>
      <button class="primary" id="sendBtn" type="submit">Send to office →</button>
    </form>
  </div>

  <div class="card">
    <div class="muted" style="font-weight:700;margin-bottom:8px">RECENT SNAPS</div>
    <div id="list"><div class="muted">Nothing yet</div></div>
  </div>
</main>

<script type="module">
const CFG={apiKey:"AIzaSyAkNK-8qXg6kHTqrpof90BwIM81vh5ER4o",

const V='10.12.5';
const [appM,authM,fsM,stM]=await Promise.all([
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),

let data=[];             // live mirror of 'dosnaps'
let me='',myEmail='';
let photoFile=null;
let extras=[];
const ADMIN='jaamiz25@gmail.com';
const uid=()=>'dp'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const iso=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const today=()=>iso(new Date());
const fmtD=s=>s?s.split('-').reverse().join('-'):'';
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);};

/* ---------- image compression: max 1600px JPEG — a DO photo lands ~150-400 KB ---------- */
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const MAX=1600;
      let w=img.naturalWidth,h=img.naturalHeight;
      const sc=Math.min(1,MAX/Math.max(w,h));
      w=Math.round(w*sc);h=Math.round(h*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('compress failed')),'image/jpeg',0.8);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('not an image'));};
    img.src=url;
  });
}
async function upload(path,blob){
  const r=stM.ref(fst,path);
  await stM.uploadBytes(r,blob,{contentType:'image/jpeg'});
  return await stM.getDownloadURL(r);
}

/* ---------- auth ---------- */
window.doSignIn=async ev=>{

  const b=document.getElementById('g_btn'),err=document.getElementById('g_err');
  b.disabled=true;b.textContent='Signing in…';err.textContent='';

  catch(e){err.textContent='Sign-in failed: '+(e.code||e.message).replace('auth/','').replace(/-/g,' ');}

/* ---------- OCR auto-read (in-browser Tesseract, free): fills ONLY empty fields, always amendable ---------- */
let ocrRno='';
let tessP=null;
const tessLoad=()=>{
  if(tessP)return tessP;
  tessP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>res(window.Tesseract);
    s.onerror=()=>{tessP=null;rej(new Error('load failed'));};
    document.head.appendChild(s);
  });
  return tessP;
};
const ocrImg=file=>new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('bad image'));i.src=u;});
function ocrCanvas(img,rot){
  const MAX=2000;let w=img.naturalWidth,h=img.naturalHeight;
  const sc=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
  const c=document.createElement('canvas');
  if(rot===90||rot===270){c.width=h;c.height=w;}else{c.width=w;c.height=h;}
  const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(img,-w/2,-h/2,w,h);
  return c;
}
function ocrParse(text){
  const t=(text||'').toUpperCase(),out={};
  const awb=t.match(/\b(\d{3})\s*[-–—]?\s*(\d{8})\b/);if(awb)out.awb=awb[1]+'-'+awb[2];
  const lines=t.split(/\n/).map(l=>l.trim());
  const ci=lines.findIndex(l=>/CONSIGNEE/.test(l)&&!/AGENT/.test(l));
  if(ci>=0){
    const clean=s=>{let nm=String(s||'').replace(/.*CONSIGNEE/,'').replace(/^[\s:.\-]+/,'').replace(/[^A-Z0-9&.\-' ]+/g,' ').replace(/\s+/g,' ').trim();
      return nm.split(/\b(?:PCS|WGT|RECEIVED|NOTIFY|RECEIPT|CONDITION|LOCATION|SIGN|DATE|ID CARD|ADDRESS|ACCOUNT|N ?O ?G)\b/)[0].trim().slice(0,40).trim();};
    let nm=clean(lines[ci]);
    if(nm.length<4)nm=clean((lines.slice(ci+1).find(l=>l.trim().length>=4))||'');
    if(nm.length>=4)out.consignee=nm;
  }
  if(/STELCO|STATE\s*ELECTRIC/.test(t))out.consignee='STATE ELECTRIC COMPANY';
  const wg=t.match(/WGT[^\n]*?\b\d+\s*\/\s*(\d+(?:[.,]\d+)?)/)
        ||t.match(/GROSS\s*(?:WEIGHT|WT)[^0-9]{0,12}(\d+(?:[.,]\d+)?)/)
        ||t.match(/CHARGEABLE\s*(?:WEIGHT|WT)?[^0-9]{0,12}(\d+(?:[.,]\d+)?)/);
  if(wg)out.kg=Number(wg[1].replace(',','.'));
  const rn=t.match(/\bR\s*[=\-:]\s*(\d{4,6})\b/);if(rn)out.rNo=rn[1];
  return out;
}
let pdfP=null;
const pdfLoad=()=>{
  if(pdfP)return pdfP;
  pdfP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';res(window.pdfjsLib);}catch(e){pdfP=null;rej(e);}};
    s.onerror=()=>{pdfP=null;rej(new Error('pdf lib failed'));};
    document.head.appendChild(s);
  });
  return pdfP;
};
async function pdfExtract(file,status){
  const lib=await pdfLoad();
  status('🔍 Reading PDF…');
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  let text='';
  for(let i=1;i<=Math.min(doc.numPages,3);i++){
    const tc=await (await doc.getPage(i)).getTextContent();
    text+=tc.items.map(it=>it.str).join('\n')+'\n';
  }
  const p=ocrParse(text);
  if(p.awb||p.consignee||p.kg)return p;
  const T=await tessLoad();
  let best=null;
  for(let i=1;i<=Math.min(doc.numPages,2);i++){
    status('🔍 Reading scanned PDF — page '+i+'…');
    const pg=await doc.getPage(i);
    const base=pg.getViewport({scale:1});
    const vp=pg.getViewport({scale:Math.min(2,2000/Math.max(base.width,base.height))});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    try{
      const r=await T.recognize(c,'eng');
      const q=ocrParse(r&&r.data&&r.data.text);
      if(q.awb)return q;
      if(!best&&(q.consignee||q.kg))best=q;
    }catch(e){}
  }
  return best;
}
async function ocrRun(file){
  const st=document.getElementById('ocrStatus');
  try{
    let best=null;
    if(isPdf(file)){
      // 75 s cap — some scanned PDFs wedge the reader; give up and let the user type
      best=await Promise.race([pdfExtract(file,m=>st.textContent=m),new Promise(res=>setTimeout(()=>res(null),75000))]);
    }else{
      const T=await tessLoad();
      const img=await ocrImg(file);
      for(const rot of [0,270,90,180]){
        st.textContent='🔍 Reading photo'+(rot?' ↻':'')+'…';
        try{
          const r=await T.recognize(ocrCanvas(img,rot),'eng');
          const p=ocrParse(r&&r.data&&r.data.text);
          if(p.awb){best=p;break;}
          if(!best&&(p.consignee||p.kg))best=p;
        }catch(e){}
      }
    }
    if(!best||!best.awb){ // the file name itself often carries the AWB ("HAWB_125-22299535_….pdf")
      const m=(file.name||'').match(/(\d{3})[-_ ]?(\d{8})/);
      if(m){best=best||{};best.awb=m[1]+'-'+m[2];}
    }
    if(!best){st.textContent='Could not read — type the details';return;}
    const got=[];
    const set=(id,v,l)=>{const el=document.getElementById(id);if(v!=null&&v!==''&&el.value===''){el.value=v;got.push(l+' '+v);}};
    set('f_awb',best.awb,'AWB');set('f_kg',best.kg,'KG');set('f_customer',best.consignee,'');
    if(best.rNo){ocrRno=best.rNo;got.push('R '+best.rNo);}
    st.textContent=got.length?'✓ Auto-read: '+got.join(', ')+' — check & amend if wrong':'Photo read — type the details';
  }catch(e){st.textContent='Auto-read unavailable — type the details';}
}

/* ---------- form ---------- */
const isPdf=f=>f&&(f.type==='application/pdf'||/\.pdf$/i.test(f.name||''));
window.gotPhoto=()=>{
  const f=document.getElementById('f_photo').files[0];
  photoFile=f||null;
  const b=document.getElementById('snapBtn');
  b.textContent=f?'✅ DO ready — tap to change':'📸 DO photo / file (PDF ok)';
  b.classList.toggle('got',!!f);
  document.getElementById('ocrStatus').textContent='';
  document.getElementById('clrPhoto').style.display=f?'':'none';
  ocrRno='';
  if(f)ocrRun(f); // photos AND PDFs auto-read; fills empty fields only
};
window.clearPhoto=()=>{
  document.getElementById('f_photo').value='';
  window.gotPhoto();
  document.getElementById('ocrStatus').textContent='Removed — take the DO again';
};
window.exAdd=name=>{
  const item=name||prompt('Charge name:','');
  if(item===null||!String(item).trim())return;
  const amt=Number(prompt('Amount Rf for "'+item+'":',''));
  if(!amt||amt<=0){toast('No amount — charge not added');return;}
  extras.push({item:String(item).trim(),amount:amt});
  renderExtras();
};
window.exDel=i=>{extras.splice(i,1);renderExtras();};
function renderExtras(){
  document.getElementById('exList').innerHTML=extras.map((x,i)=>
    `<div class="exrow"><b>${esc(x.item)}</b><span>Rf ${x.amount.toLocaleString()}</span><button type="button" class="del" onclick="exDel(${i})">🗑</button></div>`).join('');
}
window.saveSnap=async ev=>{
  ev.preventDefault();
  const awb=document.getElementById('f_awb').value.trim();
  const kg=Number(document.getElementById('f_kg').value);
  if(!photoFile){toast('Take the DO photo first');return false;}
  if(!awb||!kg){toast('AWB and weight are required');return false;}
  const btn=document.getElementById('sendBtn');
  btn.disabled=true;btn.textContent='Uploading…';
  try{
    const id=uid();
    const photos=[];
    const putFile=async(file,label,base)=>{
      let blob=file,ext='.jpg',ct;
      if(isPdf(file)){ext='.pdf';ct='application/pdf';if(file.size>25*1024*1024)throw new Error('PDF over 25 MB');}
      else{try{blob=await shrink(file);}catch(e){blob=file;ext='';}}
      const p='dosnaps/'+id+'/'+base+ext;
      const r=stM.ref(fst,p);
      await stM.uploadBytes(r,blob,ct?{contentType:ct}:{contentType:'image/jpeg'});
      photos.push({name:label,path:p,url:await stM.getDownloadURL(r),size:blob.size,ts:today()});
    };
    await putFile(photoFile,'DO '+awb+(isPdf(photoFile)?'.pdf':'.jpg'),'do');
    const more=Array.from(document.getElementById('f_more').files||[]);
    for(let i=0;i<more.length;i++){
      btn.textContent='Uploading '+(i+2)+'/'+(more.length+1)+'…';
      try{await putFile(more[i],more[i].name||('doc'+(i+1)),'doc'+(i+1));}
      catch(e){toast('Skipped '+(more[i].name||'a file'));}
    }
    const macl=Number(document.getElementById('f_macl').value)||null;
    const demur=Number(document.getElementById('f_demur').value)||null;
    const rec={id,awb,kg,macl,demur,rNo:ocrRno||'',customer:document.getElementById('f_customer').value.trim(),
      extras:extras.slice(),photos,by:me,byEmail:myEmail,
      date:today(),time:new Date().toTimeString().slice(0,5),status:'pending',u:Date.now()};
    await fsM.setDoc(fsM.doc(db,'dosnaps',id),JSON.parse(JSON.stringify(rec)));
    photoFile=null;extras=[];renderExtras();
    document.getElementById('f_photo').value='';document.getElementById('f_more').value='';
    document.getElementById('f_awb').value='';document.getElementById('f_kg').value='';
    document.getElementById('f_customer').value='';document.getElementById('f_macl').value='';
    document.getElementById('f_demur').value='';
    window.gotPhoto();
    toast('✅ Sent — the office will bill it now');
  }catch(e){toast('Upload failed: '+(e.code||e.message||e));}
  btn.disabled=false;btn.textContent='Send to office →';
  return false;
};
window.delSnap=async id=>{
  const r=data.find(x=>x.id===id);if(!r)return;
  if(r.status!=='pending'){toast('Already billed — cannot delete');return;}
  if(r.byEmail!==myEmail&&myEmail!==ADMIN){toast('Only '+(r.by||'the sender')+' or admin can delete this');return;}
  if(!confirm('Delete the snap for AWB '+r.awb+'?'))return;
  try{await fsM.deleteDoc(fsM.doc(db,'dosnaps',id));toast('Deleted');}
  catch(e){toast('Could not delete — check connection');}
};

/* ---------- list ---------- */
function stHTML(r){
  if(r.status==='billed')return '<span class="st b">✅ BILLED'+(r.billNo?' · '+esc(r.billNo):'')+'</span>';
  if(r.entryId)return '<span class="st t">📋 IN TRACKER</span>';
  return '<span class="st p">⏳ PENDING</span>';
}
function render(){
  const pend=data.filter(r=>r.status==='pending');
  const m=today().slice(0,7);
  document.getElementById('st_pend').textContent=pend.length;
  document.getElementById('st_month').textContent=data.filter(r=>r.status==='billed'&&(r.billedAt||r.date||'').startsWith(m)).length;
  const rows=data.slice().sort((a,b)=>(b.u||0)-(a.u||0)).slice(0,30);
  document.getElementById('list').innerHTML=rows.length?rows.map(r=>{
    const phs=r.photos||[];
    const phImg=phs.find(function(p){return !/\.pdf$/i.test(p.path||p.name||'')});
    const ph=phImg||phs[0]||null;
    return `<div class="item">
      ${ph?(phImg?`<a href="${esc(ph.url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(ph.url)}" alt="DO"></a>`
        :`<a href="${esc(ph.url)}" target="_blank" rel="noopener" class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:24px;text-decoration:none">📄</a>`):''}
      <div class="mid">
        <div class="awb">${esc(r.awb)} · ${r.kg} kg</div>
        <div class="sub">${esc(r.customer||'')}${r.customer?' · ':''}${fmtD(r.date)} ${esc(r.time||'')} · ${esc(r.by)}${r.macl?' · MACL '+r.macl:''}${r.demur?' · DEM '+r.demur:''}${(r.extras||[]).length?' · +'+r.extras.map(x=>esc(x.item)).join(', '):''}</div>
      </div>
      ${stHTML(r)}
      ${r.status==='pending'?`<button class="del" onclick="delSnap('${r.id}')">🗑</button>`:''}
    </div>`;}).join(''):'<div class="muted">Nothing yet</div>';
}
render();
</script>
</body>
</html>
