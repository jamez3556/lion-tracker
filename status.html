<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Shipment Status — LION Logistics</title>
<style>
:root{
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
  --brand:#e8730f; --ok:#15803d; --warn:#b45309; --danger:#dc2626; --info:#1d4ed8;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:#0f172a;color:#fff;padding:16px 18px}
.hwrap{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:9px;background:var(--brand);display:grid;place-items:center;
  font-weight:800;font-size:17px;flex:0 0 auto}
h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.01em}
.sub{font-size:12px;color:#94a3b8;margin-top:1px}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
.who{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.who b{font-size:16px}
.who .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 14px;flex:1 1 auto;min-width:104px}
.stat .n{font-size:21px;font-weight:800;line-height:1.1}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.ship{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px}
.ship-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ref{font-weight:800;font-size:15px;word-break:break-all}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.p-pending{background:#fef3c7;color:#92400e}
.p-cleared{background:#dcfce7;color:#15803d}
.p-delivered{background:#e0e7ff;color:#3730a3}
.b-paid{background:#dcfce7;color:#15803d}
.b-due{background:#fee2e2;color:#b91c1c}
.b-inv{background:#dbeafe;color:#1d4ed8}
.b-none{background:#f1f5f9;color:#475569;border:1px dashed #cbd5e1}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (prefers-color-scheme:dark){
  .b-none{background:#1a222c;color:#94a3b8;border-color:#334155}
}
.rows{margin-top:11px;display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px}
.f{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.f .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f .v{font-weight:700;font-size:13.5px;margin-top:1px}
.warnbox{margin-top:10px;padding:8px 11px;border-radius:9px;font-size:13px;font-weight:700}
.w-soon{background:#fef3c7;color:#92400e}
.w-late{background:#fee2e2;color:#b91c1c}
.w-ok{background:#dcfce7;color:#166534}
table.ctn{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
table.ctn th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;border-bottom:1px solid var(--line)}
table.ctn td{padding:5px 6px;border-bottom:1px solid #f1f5f9}
.scroll{overflow-x:auto}
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 20px;text-align:center;color:var(--muted)}
footer{max-width:900px;margin:0 auto;padding:0 14px 30px;font-size:12px;color:var(--muted);text-align:center}
a{color:var(--brand)}
@media (prefers-color-scheme:dark){
  :root{--ink:#e6edf6;--muted:#94a3b8;--line:#26303d;--bg:#0b1118;--card:#141b24}
  .f{background:#0f1720}
  table.ctn td{border-bottom-color:#1c242f}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo">L</div>
  <div><h1>LION LOGISTICS</h1><div class="sub">Shipment &amp; customs clearance status</div></div>
</div></header>
<main id="main"><div class="msg">Loading your shipments…</div></main>
<footer id="foot"></footer>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

// Same public web config the tracker uses. It grants nothing on its own: this page can only read
// portal/<key> because the security rule allows a get there and denies listing.
const app=initializeApp({
  apiKey:'AIzaSyAkNK-8qXg6kHTqrpof90BwIM81vh5ER4o',
  authDomain:'lion-tracker-47830.firebaseapp.com',
  projectId:'lion-tracker-47830',
  storageBucket:'lion-tracker-47830.firebasestorage.app',
  messagingSenderId:'1076678882929',
  appId:'1:1076678882929:web:bf0a470ec4b5e639b20dd0'
});
const db=getFirestore(app);

const main=document.getElementById('main');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(d){
  if(!d)return '—';
  const p=String(d).split('-');
  if(p.length!==3)return esc(d);
  return Number(p[2])+' '+MON[Number(p[1])-1]+" '"+p[0].slice(2);
}
// Working days to a date, Fridays excluded — the same rule the office uses for the free period.
function daysLeft(d){
  if(!d)return null;
  const t=new Date();t.setHours(0,0,0,0);
  const target=new Date(d+'T00:00:00');
  const cal=Math.round((target-t)/86400000);
  if(cal===0)return 0;
  if(Math.abs(cal)>3660)return cal;
  const step=cal>0?1:-1;let n=0;const cur=new Date(t);
  for(let i=0;i<Math.abs(cal);i++){cur.setDate(cur.getDate()+step);if(cur.getDay()!==5)n+=step;}
  return n;
}
function pill(s){
  const k=s==='Delivered'?'p-delivered':(s==='Cleared'?'p-cleared':'p-pending');
  const label=s==='Delivered'?'Completed':s;
  return `<span class="pill ${k}">${esc(label)}</span>`;
}
function field(k,v){return `<div class="f"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`;}
function money(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
// Billing state, said plainly and never guessed. "Paid"/"Payment due" only appear when QuickBooks has
// actually reported the balance; with an invoice but no balance figure we just say "Invoiced".
function billState(s){
  const cleared=!!(s.clearance||s.status==='Cleared'||s.status==='Delivered');
  if(!s.billNo)return cleared?{k:'b-none',t:'Not billed yet'}:null;
  if(s.balance==null)return {k:'b-inv',t:'Invoiced'};
  return Number(s.balance)<=0?{k:'b-paid',t:'Paid'}:{k:'b-due',t:'Payment due'};
}

function shipCard(s){
  const sea=s.type==='MP';
  const ref=(sea?'BL ':'AWB ')+(s.awbBl||s.blNo||'—');
  const done=s.status==='Delivered'||s.status==='Cleared';
  const bs=billState(s);
  let out=`<div class="ship"><div class="ship-top">
      <div><div class="ref">${esc(ref)}</div>
        <div class="meta">${sea?'Sea freight':'Air freight'} · logged ${fmt(s.date)}${s.rNo?' · Ref '+esc(s.rNo):''}</div></div>
      <div class="pills">${pill(s.status)}${bs?`<span class="pill ${bs.k}">${esc(bs.t)}</span>`:''}</div>
    </div><div class="rows">`;
  if(s.pkgs!=='')out+=field('Packages',esc(s.pkgs));
  if(s.grsWt!=='')out+=field('Gross weight',esc(s.grsWt)+' kg');
  if(s.doDate)out+=field('Delivery order',fmt(s.doDate));
  if(s.lastDate)out+=field('Last free date',fmt(s.lastDate));
  if(s.clearance)out+=field('Cleared',fmt(s.clearance));
  if(s.billNo)out+=field('Invoice',esc(s.billNo));
  if(s.total!=null)out+=field('Invoice total',money(s.total));
  if(s.balance!=null&&Number(s.balance)>0)out+=field('Balance due',money(s.balance));
  out+='</div>';
  if(bs&&bs.k==='b-none')out+=`<div class="warnbox w-soon">Cleared — your invoice is being prepared.</div>`;
  if(bs&&bs.k==='b-due')out+=`<div class="warnbox w-late">Payment due: ${money(s.balance)} against invoice ${esc(s.billNo)}.</div>`;
  // free-period warning, only while the cargo is still in port
  if(s.lastDate&&!s.clearance&&!done){
    const n=daysLeft(s.lastDate);
    if(n!==null){
      if(n<0)out+=`<div class="warnbox w-late">⚠ Free period ended ${Math.abs(n)} working day${Math.abs(n)===1?'':'s'} ago — storage charges may apply.</div>`;
      else if(n===0)out+=`<div class="warnbox w-late">⚠ Last free day is today.</div>`;
      else if(n<=3)out+=`<div class="warnbox w-soon">${n} working day${n===1?'':'s'} left before storage charges start.</div>`;
      else out+=`<div class="warnbox w-ok">${n} working days left in the free period.</div>`;
    }
  }
  if(s.containers&&s.containers.length){
    out+='<div class="scroll"><table class="ctn"><thead><tr><th>Container</th><th>Size</th><th>Arrived</th><th>Discharged</th><th>Out of port</th></tr></thead><tbody>';
    s.containers.forEach(c=>{
      out+=`<tr><td><b>${esc(c.no)}</b></td><td>${esc(c.size||'—')}</td><td>${fmt(c.arrival)}</td><td>${fmt(c.discharge)}</td><td>${c.out?fmt(c.out):'—'}</td></tr>`;
    });
    out+='</tbody></table></div>';
  }
  return out+'</div>';
}

function render(d){
  const ships=d.shipments||[];
  const active=ships.filter(s=>s.status!=='Delivered').length;
  const inPort=ships.filter(s=>s.lastDate&&!s.clearance&&s.status!=='Delivered').length;
  const due=ships.filter(s=>{if(!s.lastDate||s.clearance||s.status==='Delivered')return false;
    const n=daysLeft(s.lastDate);return n!==null&&n<=3;}).length;
  const states=ships.map(billState);
  const notBilled=states.filter(b=>b&&b.k==='b-none').length;
  const unpaid=ships.filter((s,i)=>states[i]&&states[i].k==='b-due');
  const owed=unpaid.reduce((t,s)=>t+Number(s.balance||0),0);
  let h=`<div class="who"><div class="k">Account</div><b>${esc(d.name||'—')}</b>
      <div class="meta" style="font-size:12.5px;color:var(--muted)">Customer number ${esc(d.cno||'—')}</div></div>
    <div class="stats">
      <div class="stat"><div class="n">${ships.length}</div><div class="l">Shipments</div></div>
      <div class="stat"><div class="n">${active}</div><div class="l">In progress</div></div>
      <div class="stat"><div class="n">${inPort}</div><div class="l">Awaiting clearance</div></div>
      <div class="stat" style="${due?'outline:2px solid var(--danger)':''}"><div class="n" style="${due?'color:var(--danger)':''}">${due}</div><div class="l">Due within 3 days</div></div>
      ${notBilled?`<div class="stat"><div class="n">${notBilled}</div><div class="l">Awaiting invoice</div></div>`:''}
      ${unpaid.length?`<div class="stat" style="outline:2px solid var(--danger)"><div class="n" style="color:var(--danger)">${unpaid.length}</div><div class="l">Payment due</div></div>`:''}
    </div>
    ${owed>0?`<div class="who" style="border-color:#fecaca;background:#fef2f2;color:#b91c1c">
        <div class="k" style="color:#b91c1c">Outstanding balance</div><b>${money(owed)}</b>
        <div style="font-size:12.5px;margin-top:2px">across ${unpaid.length} invoice${unpaid.length===1?'':'s'}</div></div>`:''}`;
  h+=ships.length?ships.map(shipCard).join(''):'<div class="msg">No shipments on this account yet.</div>';
  main.innerHTML=h;
  document.getElementById('foot').innerHTML=
    `Updated ${fmt(d.updated)}${d.updatedTime?' at '+esc(d.updatedTime):''} · LION Logistics Pvt Ltd, Malé, Maldives<br>
     Questions about a shipment? Reply to your usual contact at LION Logistics.`;
}

(async()=>{
  const key=(location.hash||'').replace(/^#/,'').trim();
  if(!key){main.innerHTML='<div class="msg">This link is incomplete. Please use the full link sent to you by LION Logistics.</div>';return;}
  try{
    const snap=await getDoc(doc(db,'portal',key));
    if(!snap.exists()){
      main.innerHTML='<div class="msg">This tracking link is no longer active.<br>Please contact LION Logistics for a new one.</div>';return;
    }
    render(snap.data());
  }catch(err){
    console.error(err);
    main.innerHTML='<div class="msg">Could not load your shipments right now. Please try again shortly.</div>';
  }
})();
</script>
</body>
</html>
